[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teamform"
version = "1.0.0"
description = "Fair, balanced and rotating team formation for project-based learning curricula"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "numba>=0.58", "scipy>=1.10", "networkx>=3.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
data = ["pyreadr>=0.5"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
